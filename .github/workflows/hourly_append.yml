name: Hourly Append BTC/ETH Data

on:
  schedule:
    - cron: "0 * * * *"   # every hour at minute 0
  workflow_dispatch:

jobs:
  append_data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install gspread pandas requests google-auth

      - name: Save Google service key
        run: |
          mkdir -p $GITHUB_WORKSPACE/.config
          echo "${{ secrets.GOOGLE_SERVICE_JSON }}" > $GITHUB_WORKSPACE/.config/tradingbotdata.json

      - name: Run trading bot
        run: python3 auto_append_btc_eth.py
        env:
          JSON_KEY_PATH: $GITHUB_WORKSPACE/.config/tradingbotdata.json
