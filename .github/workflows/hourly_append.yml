name: Hourly Append BTC/ETH Data

# Run every hour, or manually
on:
  schedule:
    - cron: "0 * * * *"   # at minute 0 every hour
  workflow_dispatch:

jobs:
  append_data:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - uses: actions/checkout@v3

      # 2️⃣ Set up Python
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Install dependencies
      - name: Install Python dependencies
        run: |
          pip install gspread pandas requests google-auth

      # 4️⃣ Save Google service JSON safely
      - name: Save Google service key
        run: |
          mkdir -p ${{ github.workspace }}/.config
          printf "%s" "${{ secrets.GOOGLE_SERVICE_JSON }}" > ${{ github.workspace }}/.config/tradingbotdata.json

      # 5️⃣ Optional: preview first few lines of JSON to verify
      - name: Verify JSON file
        run: head -n 5 ${{ github.workspace }}/.config/tradingbotdata.json

      # 6️⃣ Run your Python script
      - name: Run trading bot
        run: python3 auto_append_btc_eth.py
        env:
          JSON_KEY_PATH: ${{ github.workspace }}/.config/tradingbotdata.json
