name: Hourly Append BTC/ETH Data

# Triggers: every hour, or manually
on:
  schedule:
    - cron: "0 * * * *"   # run at minute 0 every hour
  workflow_dispatch:

jobs:
  append_data:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          pip install gspread pandas requests google-auth

      # Step 4: Save Google service key safely using printf to preserve newlines
      - name: Save Google service key
        run: |
          mkdir -p ${{ github.workspace }}/.config
          printf "%s" "${{ secrets.GOOGLE_SERVICE_JSON }}" > ${{ github.workspace }}/.config/tradingbotdata.json

      # Step 5: Optional verification - first few lines of JSON
      - name: Verify JSON file
        run: |
          echo "First 5 lines of Google service JSON:"
          head -n 5 ${{ github.workspace }}/.config/tradingbotdata.json

      # Step 6: Run Python trading bot
      - name: Run trading bot
        run: python3 auto_append_btc_eth.py
        env:
          JSON_KEY_PATH: ${{ github.workspace }}/.config/tradingbotdata.json
